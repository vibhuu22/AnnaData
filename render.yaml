# Render Blueprint — deploys all three AnnaData services from this one repo.
#
# Render reads this file automatically when you create a Blueprint from the
# repo. Values marked `sync: false` are NOT stored here; Render prompts for them
# at deploy time, which is how the API key and gateway password stay out of Git.
#
# Free instances sleep after ~15 minutes idle and take ~50s to wake. See the
# "Keeping the services warm" section of README.md before pointing real farmers
# at the SMS number.

services:
  # ----------------------------------------------------------------- backend
  - type: web
    name: annadata-backend
    runtime: python
    plan: free
    region: singapore          # closest Render region to India
    rootDir: AnnaData-Backend-main
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.7"
      - key: PYTHONUNBUFFERED
        value: "1"
      # Farmer queries and answers are frequently Devanagari/Gurmukhi.
      - key: PYTHONIOENCODING
        value: "utf-8"
      # The only required secret. Render will prompt for it.
      - key: GEMINI_API_KEY
        sync: false
      # Fastest model first; later entries are fallbacks on 429/503/404.
      - key: TEXT_MODELS
        value: gemini-3.1-flash-lite,gemini-3.6-flash,gemini-3.5-flash-lite
      - key: MEDIA_MODEL
        value: gemini-3.5-flash-lite
      # Set to the frontend's Render URL after the first deploy, so CORS allows it.
      - key: FRONTEND_URL
        sync: false
      # Optional integrations — leave blank to disable; /health reports status.
      - key: GOV_API_KEY
        sync: false
      - key: LOCATION_API_KEY
        sync: false
      - key: EE_SERVICE_KEY
        sync: false
      - key: KNOWLEDGE_BASE_ID
        sync: false
      - key: AWS_ACCESS_KEY
        sync: false
      - key: AWS_SECRET_KEY
        sync: false

  # --------------------------------------------------------------- SMS bridge
  - type: web
    name: annadata-sms
    runtime: python
    plan: free
    region: singapore
    rootDir: AnnaData-SMS-main
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.7"
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: PYTHONIOENCODING
        value: "utf-8"
      - key: SMS_MODE
        value: cloud
      # From the Android app's "Cloud Server" section.
      - key: APP_USERNAME
        sync: false
      - key: PASSWORD
        sync: false
      # The backend's Render host. A bare hostname is fine — it is normalised
      # to a full https://.../agent URL at startup.
      - key: AI_ENDPOINT
        fromService:
          type: web
          name: annadata-backend
          property: host
      # This service's own public URL, used by webhook.py to register the
      # sms:received webhook with the gateway.
      - key: PUBLIC_URL
        fromService:
          type: web
          name: annadata-sms
          property: host
      - key: MAX_SMS_SEGMENTS
        value: "4"

  # ----------------------------------------------------------------- frontend
  - type: web
    name: annadata-frontend
    runtime: static
    rootDir: AnnaData-Frontend-main
    buildCommand: npm ci && npm run build
    staticPublishPath: build
    envVars:
      # Create React App inlines this at BUILD time, so changing it needs a
      # redeploy, not just a restart.
      - key: REACT_APP_API_URL
        fromService:
          type: web
          name: annadata-backend
          property: host
    routes:
      # Single-page app: serve index.html for any unmatched path.
      - type: rewrite
        source: /*
        destination: /index.html
